# Voice designs for the MOSS backend (docs/MOSS-Backend-Handoff.md).
#
# Each description becomes a reference clip: Qwen3-TTS VoiceDesign speaks
# the calibration sentence in that voice (tools/design_voices.py, `make
# design-voices`), and MOSS-TTS continues that clip for every line the voice
# says. The clips live in helper/voices/moss/refs/ and are never committed.
#
# Descriptions follow the attribute style Qwen's examples use: gender, age,
# timbre, pace, accent, manner. Changing one, or its seed, and running `make
# design-voices ONLY=Name FRESH=1` gives a new clip; the pack cache then
# re-renders only that voice's lines. Listen with `make review-voices`.
#
#   calibration  the sentence every clip says, and the text MOSS continues
#                from, so it must stay what the clips actually say
#   cast         one voice per named character; `also` lists other names
#                that share it (Volto Oscuro is Iroha's shadow)
#   pools        voices per casting group (helper/casting.py's POOLS), for
#                everyone else; a speaker is drawn from their group's list by
#                a stable hash of their name
#
# A seed is optional (1 by default); the nine characters heard in the
# listening spike keep the seeds their spike clips were drawn with.

calibration: >-
  Wait here while I speak with the guards. If anything goes wrong, follow
  the road back to town and do not look behind you.

cast:
