# Voice designs: the casting record and the prompt each voice is made from
# (docs/ElevenLabs-Handoff.md, docs/MOSS-Backend-Handoff.md).
#
# A named character's prompt is pasted into ElevenLabs' voice design by hand
# (`make voice-prompts ONLY=Name` prints it). The MOSS backend's clips came
# from the same file: Qwen3-TTS VoiceDesign speaks the calibration sentence
# in the voice (tools/design_voices.py, `make design-voices`), and MOSS-TTS
# continues that clip. Those clips live in helper/voices/moss/refs/ and are
# never committed. Edit by hand or with `make review-voices`.
#
# A design is meta plus a description, composed into the form ElevenLabs
# asks for:
#
#     Native <accent>. <Gender>, <age>. <Quality> quality.
#     Persona: <persona>. Emotion: <emotion>.
#     <description>
#
# so the description holds only the last line: one or two sentences about
# timbre, pacing, and delivery. A blank field leaves its part out. The
# quality level is the run's, not the file's: `make ... QUALITY=`, high by
# default.
#
#   calibration  the sentence every clip says, and the text MOSS continues
#                from, so it must stay what the clips actually say
#   cast         one voice per named character:
#                  gender, age   as the prompt says them ("male",
#                                "late-thirties")
#                  race          never in the prompt; here for whoever is
#                                designing the voice. One of the casting
#                                groups' races (helper/casting.py)
#                  accent        what follows "Native": a language or a
#                                place's adjective ("Japanese")
#                  persona       two to five words ("a samurai")
#                  emotion       two or three adjectives ("grave and stoic")
#                  description   the last line; may be left out when there
#                                is a persona or an emotion
#                  line          what the voice says while it is designed:
#                                one of the character's own lines, kept as
#                                "sha1:" and a short hash because the
#                                game's text is never committed (the
#                                review window picks it and shows the
#                                text, from data/voice_lines.json), or any
#                                text written for the purpose
#                  seed          optional, 1 by default (Qwen's)
#                  also          other names that share the voice (Volto
#                                Oscuro is Iroha's shadow)
#                Every speaker with twenty lines or more across the
#                storylines gets one, so no character the player will
#                remember shares a pool voice
#   pools        voices per casting group (helper/casting.py's POOLS: a
#                race, a sex, and an age band, two voices each, or one of
#                the special buckets) for everyone else: cast.py spreads a
#                group round-robin over them, the census draws by a stable
#                hash. The group gives gender and race; each voice has an
#                age, by default its band's, and a description. With
#                ElevenLabs these are to be stock voices, so a pool voice
#                has no accent, persona, or emotion
#
# Changing a design, or its seed, and running `make design-voices` redesigns
# only that voice; the pack cache then re-renders only its lines. The nine
# characters heard in the listening spike keep the seeds their clips were
# drawn with.

