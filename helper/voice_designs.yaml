# Voice designs for the MOSS backend (docs/MOSS-Backend-Handoff.md).
#
# Each design becomes a reference clip: Qwen3-TTS VoiceDesign speaks the
# calibration sentence in that voice (tools/design_voices.py, `make
# design-voices`), and MOSS-TTS continues that clip for every line the voice
# says. The clips live in helper/voices/moss/refs/ and are never committed.
# Edit by hand or with `make voice-review`, which auditions as you go.
#
# A design is meta plus a description. Qwen is given them composed:
#
#     Gender: <gender>. Age: <age>. <the race's phrase> <description>
#
# so the description holds only the rest: timbre, accent, pace, manner.
#
#   calibration  the sentence every clip says, and the text MOSS continues
#                from, so it must stay what the clips actually say
#   races        race -> the phrase composed in for it; Qwen does not know
#                what a Galka sounds like, so say it. Blank for none
#   cast         one voice per named character: gender, age, race, a
#                description, an optional seed (1 by default), and `also`,
#                other names that share it (Volto Oscuro is Iroha's shadow)
#   pools        voices per casting group (helper/casting.py's POOLS) for
#                everyone else, drawn by a stable hash of the speaker's
#                name; the group gives gender and race, each voice its age
#
# Changing a design, or its seed, and running `make design-voices` redesigns
# only that voice; the pack cache then re-renders only its lines. The nine
# characters heard in the listening spike keep the seeds their clips were
# drawn with.

calibration: >-
  Wait here while I speak with the guards. If anything goes wrong, follow the
  road back to town and do not look behind you.

races:
  hume: ""
  elvaan: "A tall, proud, long-eared elf, with a faint french accent."
  tarutaru: "A tiny, child-sized person with a small, high voice, though not a child."
  mithra: "A lithe cat-woman who speaks with a gentle purrs."
  galka: "A huge, heavyset beast-man with a deep, barrel chest."
  zilart: "An ancient, ageless elf of a vanished empire."
  deity: "A god or great summoned spirit."
  creature: ""
  dark: ""
  cait sith: ""
  narrator: ""

