# Who really says a line whose on-screen name is blank, "???", or a
# placeholder. Read by tools/build_pack.py (helper/cast_as.py has the rules).
#
# A cutscene names its speaker by an entity in the zone's entity list, and
# some entities have no usable name. Every zone keeps one or two actors
# literally called "???", listed beside the scene's named cast, that speak
# for whoever is still off screen: in most scenes the character's first
# named line follows straight after. A few scenes have actors with an empty
# name (Cait Sith through the Beaucedine traitor hunt) or a placeholder
# ("1", "2", "4" in the Throne Room [S] finale). The addon sees only the
# name the game shows, so the pack key keeps it; the voice is baked at
# build time, and that is what this table decides.
#
#   zone     the zone number (tools/zone_dats.json)
#   entity   the actor's id in that zone, as tools/xievent.py prints it
#   lines    text id -> the line's first words. Narrows the entry to those
#            lines, because a "???" slot is reused; the words are checked
#            against the decoded text so a stale id is caught. `events`
#            narrows to whole events instead. Neither: every line the
#            entity says.
#   as       the character whose voice to use (a name voices.json or the
#            census knows). Blank: not decided yet; the line keeps the
#            voice its shown name gets (the narrator for "" and "???").
#   note     for the reader
#
# `make pack` warns about an entry that matched no line and about an `as`
# name no casting knows, and stops if one line is cast two ways.

